{% extends "base.html" %}

{% block content %}
<main class="login-screen">
  <section class="login-card" aria-labelledby="loginTitle">
    <div class="login-brand">
      <img src="{{ url_for('static', path='/speakeasy-mouth-logo.svg') }}" alt="">
      <div>
        <p class="section-kicker">SpeakEasy</p>
        <h1 id="loginTitle">手机号密码登录</h1>
      </div>
    </div>
    <form class="login-form" action="/login" method="post">
      <input type="hidden" name="next" value="{{ next_path }}">
      <label>
        <span>手机号</span>
        <input
          name="phone"
          type="tel"
          inputmode="numeric"
          autocomplete="tel"
          pattern="1[3-9][0-9]{9}"
          placeholder="请输入 11 位手机号"
          value="{{ phone }}"
          autofocus
          required
        >
      </label>
      <label>
        <span>登录密码</span>
        <input
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="请输入登录密码"
          required
        >
      </label>
      {% if error %}
      <p class="login-error">{{ error }}</p>
      {% endif %}
      <button class="wide-button" type="submit">登录</button>
    </form>
    <p class="login-version">{{ version_matrix.version }} · {{ version_matrix.pageVersion }}</p>
  </section>
</main>
{% endblock %}
