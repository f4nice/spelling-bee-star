name: Deploy SpeakEasy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: speakeasy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to internal Ubuntu
    runs-on:
      - self-hosted
      - linux
      - x64
      - speakeasy-production
    timeout-minutes: 30

    steps:
      - name: Check out the release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]

          # github.com Git transport is unavailable on the internal network, while
          # api.github.com remains reachable. Materialize and verify the exact Git
          # tree through the authenticated Git Data API instead.
          find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import stat
          import time
          import urllib.error
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path, PurePosixPath

          api_base = "https://api.github.com"
          repository = os.environ["GITHUB_REPOSITORY"]
          commit_sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "speakeasy-production-runner",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(path):
              request = urllib.request.Request(f"{api_base}{path}", headers=headers)
              for attempt in range(1, 6):
                  try:
                      with urllib.request.urlopen(request, timeout=45) as response:
                          return json.load(response)
                  except (urllib.error.URLError, TimeoutError):
                      if attempt == 5:
                          raise
                      time.sleep(attempt * 2)

          commit = get_json(f"/repos/{repository}/git/commits/{commit_sha}")
          if commit.get("sha") != commit_sha:
              raise RuntimeError("GitHub API returned an unexpected commit.")
          tree = get_json(
              f"/repos/{repository}/git/trees/{commit['tree']['sha']}?recursive=1"
          )
          if tree.get("truncated"):
              raise RuntimeError("GitHub API truncated the release tree.")

          blobs = [entry for entry in tree["tree"] if entry["type"] == "blob"]
          unsupported = [
              entry
              for entry in tree["tree"]
              if entry["type"] == "commit"
              or (entry["type"] == "blob" and entry["mode"] not in {"100644", "100755"})
          ]
          if unsupported:
              raise RuntimeError(
                  "Submodules, symlinks, and special files are not supported in releases."
              )

          def materialize(entry):
              relative = PurePosixPath(entry["path"])
              if relative.is_absolute() or ".." in relative.parts or "\\" in entry["path"]:
                  raise RuntimeError(f"Unsafe repository path: {entry['path']!r}")
              payload = get_json(f"/repos/{repository}/git/blobs/{entry['sha']}")
              if payload.get("encoding") != "base64":
                  raise RuntimeError(f"Unsupported blob encoding for {entry['path']!r}")
              encoded = "".join(payload["content"].split())
              data = base64.b64decode(encoded, validate=True)
              digest = hashlib.sha1(
                  f"blob {len(data)}\0".encode("ascii") + data
              ).hexdigest()
              if digest != entry["sha"]:
                  raise RuntimeError(f"Blob verification failed for {entry['path']!r}")
              target = workspace.joinpath(*relative.parts)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              target.chmod(
                  stat.S_IRUSR
                  | stat.S_IWUSR
                  | stat.S_IRGRP
                  | stat.S_IROTH
                  | (stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH
                     if entry["mode"] == "100755" else 0)
              )

          with ThreadPoolExecutor(max_workers=8) as executor:
              list(executor.map(materialize, blobs))

          workspace.joinpath(".release-commit").write_text(
              f"{commit_sha}\n", encoding="ascii"
          )
          print(f"Materialized {len(blobs)} verified files for {commit_sha}.")
          PY
          unset GH_TOKEN

          test "$(cat .release-commit)" = "${GITHUB_SHA}"
          test -f app/main.py
          test -f requirements.txt

      - name: Verify the deployment script
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "speakeasy-production"
          bash -n scripts/deploy-production-linux.sh
          test -f app/main.py
          test -f requirements.txt

      - name: Deploy on 192.168.1.186
        shell: bash
        env:
          SPEAKEASY_PROJECT_PATH: /opt/speakeasy/current
          SPEAKEASY_SERVICE_NAME: speakeasy-local.service
          SPEAKEASY_PUBLIC_BASE_URL: https://www.newabby.com
        run: bash scripts/deploy-production-linux.sh
