name: Deploy SpeakEasy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: speakeasy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to internal Ubuntu
    runs-on:
      - self-hosted
      - linux
      - x64
      - speakeasy-production
    timeout-minutes: 30

    steps:
      - name: Check out the release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]

          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git init .
          fi

          repository_url="https://github.com/${GITHUB_REPOSITORY}.git"
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "${repository_url}"
          else
            git remote add origin "${repository_url}"
          fi

          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags --prune --depth=1 origin "${GITHUB_SHA}"
          unset auth_header GH_TOKEN

          git checkout --force --detach "${GITHUB_SHA}"
          git clean -ffdx

      - name: Verify the deployment script
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "speakeasy-production"
          bash -n scripts/deploy-production-linux.sh
          test -f app/main.py
          test -f requirements.txt

      - name: Deploy on 192.168.1.186
        shell: bash
        env:
          SPEAKEASY_PROJECT_PATH: /opt/speakeasy/current
          SPEAKEASY_SERVICE_NAME: speakeasy-local.service
          SPEAKEASY_PUBLIC_BASE_URL: https://www.newabby.com
        run: bash scripts/deploy-production-linux.sh
